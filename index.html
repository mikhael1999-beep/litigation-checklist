const TYPE_LABELS = {
  unopposed: "Unopposed Motion",

  default:   "Default Judgment"
};

const ATTORNEYS = [
  { name: "Westine van Tonder",  email: "westine@hibbertlaw.co.za" },
  { name: "Clarissa Viljoen",    email: "clarissa@hibbertlaw.co.za" },
  { name: "Charne Liebenberg",   email: "charne@hibbertlaw.co.za" },
  { name: "Liezel Coetzee",      email: "liezel@hibbertlaw.co.za" },
  { name: "Mikhael Venter",      email: "aha3@hibbertlaw.co.za" },
  { name: "Jaco du Plooy",       email: "jaco@hibbertlaw.co.za" },
];

// ============================================================
// STATE
// ============================================================
let matters = {};
let currentMatterId = null;
let currentPhase = 1;
let unsubscribe = null;

// ============================================================
// FIREBASE LISTENERS
// ============================================================
function startListening() {
  if (unsubscribe) unsubscribe();
  unsubscribe = onSnapshot(collection(db, 'matters'), (snapshot) => {
    matters = {};
    snapshot.forEach(doc => {
      matters[doc.id] = { id: doc.id, ...doc.data() };
    });
    renderSidebar();
    if (currentMatterId && matters[currentMatterId]) {
      renderMatter(matters[currentMatterId]);
    } else if (!currentMatterId) {
      renderDashboard();
    }
    updateStats();
  });
}

async function saveMatter(matter) {
  try {
    await setDoc(doc(db, 'matters', matter.id), matter);
  } catch(e) {
    toast('Error saving: ' + e.message, true);
  }
}

async function toggleCheck(matterId, itemId) {
  const m = matters[matterId];
  if (!m) return;
  const newChecked = { ...m.checked, [itemId]: !m.checked[itemId] };
  try {
    await updateDoc(doc(db, 'matters', matterId), { checked: newChecked });
  } catch(e) {
    toast('Error saving', true);
  }
}

async function setDateApplied(matterId, val) {
  try {
    await updateDoc(doc(db, 'matters', matterId), { dateApplied: val || null });
  } catch(e) { toast('Error saving', true); }
}

async function setDateAllocated(matterId, val) {
  try {
    await updateDoc(doc(db, 'matters', matterId), { dateAllocated: val || null });
    if (val) { currentPhase = 2; toast('Date allocated — matter moved to Phase 2'); }
  } catch(e) { toast('Error saving', true); }
}

// ============================================================
// MATTER CREATION
// ============================================================
function openNewMatter() {
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('m-name').focus(), 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

async function createMatter() {
  const name    = document.getElementById('m-name').value.trim();
  const caseNo  = document.getElementById('m-case').value.trim();
  const type    = document.getElementById('m-type').value;
  const atty    = document.getElementById('m-attorney').value;
  const ghost   = document.getElementById('m-ghost').value.trim();
  const applied = document.getElementById('m-date-applied').value;

  if (!name || !caseNo) { toast('Please enter matter name and case number', true); return; }

  const id = Date.now().toString();
  const cl = CHECKLISTS[type];
  const checked = {};
  [...cl.phase1.items, ...cl.phase2.items].forEach(i => checked[i.id] = false);

  const matter = {
    id, name, caseNo, type, atty, ghost,
    dateApplied: applied || null,
    dateAllocated: null,
    created: new Date().toISOString(),
    checked,
  };

  await saveMatter(matter);
  closeModal();
  currentMatterId = id;
  currentPhase = 1;
  toast('Matter created — ' + name);

  // Clear form
  ['m-name','m-case','m-ghost'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('m-date-applied').value = '';
}

// ============================================================
// COURT DAY CALCULATOR
// ============================================================
function addCourtDays(date, days) {
  let d = new Date(date);
  let added = 0;
  const step = days > 0 ? 1 : -1;
  while (added < Math.abs(days)) {
    d.setDate(d.getDate() + step);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) added++;
  }
  return d;
}

function courtDaysUntil(date) {
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(date); target.setHours(0,0,0,0);
  if (target < today) return null;
  let count = 0;
  let d = new Date(today);
  while (d < target) {
    d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) count++;
  }
  return count;
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleDateString('en-ZA', { day:'numeric', month:'long', year:'numeric' });
}

function calendarDaysSince(dateStr) {
  if (!dateStr) return 0;
  return Math.floor((new Date() - new Date(dateStr)) / (1000 * 60 * 60 * 24));
}

// ============================================================
// OUTLOOK
// ============================================================
function addToCalendar(matterId, deadlineLabel, deadlineDate) {
  const m = matters[matterId];
  const subject = `[DEADLINE] ${deadlineLabel} — ${m.name} (${m.caseNo})`;
  const body    = `Litigation deadline for ${TYPE_LABELS[m.type]}.\n\nMatter: ${m.name}\nCase: ${m.caseNo}\nDeadline: ${deadlineLabel}\nDate: ${formatDate(deadlineDate)}\n\nAlbert Hibbert Attorneys Inc.`;
  const fmt = d => { const x = new Date(d); x.setHours(9,0,0,0); return x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; };
  const url = `https://outlook.office.com/calendar/action/compose?subject=${encodeURIComponent(subject)}&startdt=${fmt(deadlineDate)}&enddt=${fmt(deadlineDate)}&body=${encodeURIComponent(body)}&to=${ATTORNEYS.map(a=>a.email).join(';')}`;
  window.open(url, '_blank');
  toast('Opening Outlook calendar...');
}

function addAllToCalendar(matterId) {
  const m = matters[matterId];
  if (!m || !m.dateAllocated) return;
  const deadlines = CHECKLISTS[m.type].phase2.deadlines || [];
  deadlines.forEach((d, i) => {
    setTimeout(() => {
      const dd = addCourtDays(new Date(m.dateAllocated), d.courtDays);
      addToCalendar(matterId, d.label, dd);
    }, i * 600);
  });
}

// ============================================================
// RENDER
// ============================================================
function updateStats() {
  const all = Object.values(matters);
  document.getElementById('stat-total').textContent = all.length;
  document.getElementById('stat-p1').textContent = all.filter(m => !m.dateAllocated).length;
  document.getElementById('stat-p2').textContent = all.filter(m => m.dateAllocated).length;
  const fu = all.filter(m => m.dateApplied && calendarDaysSince(m.dateApplied) > 20 && !m.dateAllocated).length;
  const el = document.getElementById('stat-fu');
  el.textContent = fu;
  el.style.color = fu > 0 ? '#991B1B' : '#166534';
}

function renderSidebar() {
  const list = document.getElementById('matter-list');
  const all = Object.values(matters).sort((a,b) => b.created > a.created ? 1 : -1);
  if (!all.length) {
    list.innerHTML = '<div style="padding:0.75rem 1.5rem;font-size:12px;color:rgba(255,255,255,0.25);">No matters yet</div>';
    return;
  }
  list.innerHTML = all.map(m => {
    const phase = m.dateAllocated ? 2 : 1;
    const cl = CHECKLISTS[m.type];
    const items = phase === 1 ? cl.phase1.items : cl.phase2.items;
    const done  = items.filter(i => m.checked && m.checked[i.id]).length;
    const needsFollowup = m.dateApplied && calendarDaysSince(m.dateApplied) > 20 && !m.dateAllocated;
    return `<div class="matter-item ${currentMatterId === m.id ? 'active' : ''}" data-id="${m.id}" onclick="openMatter('${m.id}')">
      <div class="matter-title">${m.name}</div>
      <div class="matter-meta">${m.caseNo} · ${done}/${items.length} done</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">
        <span class="matter-badge badge-${m.type}">${TYPE_LABELS[m.type]}</span>
        <span class="matter-badge badge-phase${phase}">Phase ${phase}</span>
        ${needsFollowup ? '<span class="matter-badge" style="background:rgba(153,27,27,0.3);color:#FCA5A5;">Follow-up</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function openMatter(id) {
  currentMatterId = id;
  currentPhase = matters[id]?.dateAllocated ? 2 : 1;
  document.querySelectorAll('.matter-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const m = matters[id];
  if (!m) return;
  document.getElementById('page-title').textContent = m.name;
  document.getElementById('page-sub').textContent = TYPE_LABELS[m.type] + ' · ' + m.caseNo;
  renderMatter(m);
}

function showDashboard() {
  currentMatterId = null;
  document.querySelectorAll('.matter-item').forEach(el => el.classList.remove('active'));
  document.getElementById('page-title').textContent = 'Dashboard';
  document.getElementById('page-sub').textContent = 'Litigation matter tracking';
  renderDashboard();
}

function renderDashboard() {
  const all = Object.values(matters).sort((a,b) => b.created > a.created ? 1 : -1);
  const content = document.getElementById('main-content');
  content.innerHTML = !all.length ? `
    <div class="empty-state">
      <div class="empty-icon">⚖</div>
      <div class="empty-title">No matters yet</div>
      <div class="empty-sub">Create your first litigation matter to start tracking checklist progress and deadlines.</div>
      <button class="btn btn-primary" onclick="openNewMatter()">+ Create first matter</button>
    </div>` : `
    <div class="checklist-card">
      <div class="checklist-card-header">
        <div class="checklist-card-title">All active matters</div>
        <span class="progress-pill">${all.length} matter${all.length!==1?'s':''}</span>
      </div>
      ${all.map(m => {
        const phase = m.dateAllocated ? 2 : 1;
        const cl = CHECKLISTS[m.type];
        const items = phase === 1 ? cl.phase1.items : cl.phase2.items;
        const done  = items.filter(i => m.checked && m.checked[i.id]).length;
        const pct   = items.length ? Math.round(done / items.length * 100) : 0;
        const needsFollowup = m.dateApplied && calendarDaysSince(m.dateApplied) > 20 && !m.dateAllocated;
        const attyName = ATTORNEYS.find(a => a.email === m.atty)?.name || m.atty;
        return `<div class="checklist-item" onclick="openMatter('${m.id}')" style="cursor:pointer;">
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:500;color:var(--ink);">${m.name}</div>
            <div style="font-size:11px;color:var(--ink-3);margin-top:2px;">${m.caseNo} · ${TYPE_LABELS[m.type]} · Phase ${phase} · ${attyName}</div>
            <div style="margin-top:6px;height:4px;background:var(--paper-3);border-radius:2px;width:200px;max-width:100%;">
              <div style="height:100%;background:${pct===100?'#166534':'#B45309'};border-radius:2px;width:${pct}%;transition:width 0.3s;"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            ${needsFollowup ? '<span style="font-size:11px;font-weight:500;color:#991B1B;background:#FEE2E2;padding:3px 8px;border-radius:4px;">⚠ Follow-up</span>' : ''}
            <span style="font-size:12px;color:var(--ink-3);">${done}/${items.length}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function renderMatter(m) {
  const cl    = CHECKLISTS[m.type];
  const phase = m.dateAllocated ? 2 : 1;
  if (currentPhase > phase) currentPhase = phase;

  const daysSince    = m.dateApplied ? calendarDaysSince(m.dateApplied) : 0;
  const needsFollowup = m.dateApplied && daysSince > 20 && !m.dateAllocated;

  const p1items = cl.phase1.items;
  const p2items = cl.phase2.items;
  const p1done  = p1items.filter(i => m.checked && m.checked[i.id]).length;
  const p2done  = p2items.filter(i => m.checked && m.checked[i.id]).length;

  const items = currentPhase === 1 ? p1items : p2items;
  const checklistHtml = items.map(item => {
    const done = m.checked && m.checked[item.id];
    return `<div class="checklist-item ${done ? 'completed' : ''}">
      <div class="check-box ${done ? 'checked' : ''}" onclick="toggleCheck('${m.id}','${item.id}')">
        ${done ? '<span class="check-mark">✓</span>' : ''}
      </div>
      <div>
        <div class="item-label ${done ? 'done' : ''}">${item.label}</div>
        ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  let deadlinesHtml = '';
  if (m.dateAllocated && cl.phase2.deadlines) {
    const dls = cl.phase2.deadlines.map(d => {
      const dd = addCourtDays(new Date(m.dateAllocated), d.courtDays);
      const left = courtDaysUntil(dd);
      let cls = left === null ? 'past' : left <= 3 ? 'urgent' : left <= 7 ? 'soon' : 'ok';
      return `<div class="deadline-item">
        <span class="deadline-name">${d.label}</span>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span class="deadline-date">${formatDate(dd)}</span>
          <span class="deadline-days ${cls}">${left === null ? 'Past' : left + ' court days'}</span>
          <button class="outlook-btn" onclick="addToCalendar('${m.id}','${d.label}','${dd.toISOString()}')">📅 Outlook</button>
        </div>
      </div>`;
    }).join('');
    deadlinesHtml = `
      <div class="deadline-card">
        <div class="deadline-header">⏱ &nbsp;Calculated deadlines from ${formatDate(m.dateAllocated)}
          <button class="btn btn-sm btn-gold" onclick="addAllToCalendar('${m.id}')" style="margin-left:auto;">📅 Add all to Outlook</button>
        </div>
        ${dls}
      </div>`;
  }

  const attyName = ATTORNEYS.find(a => a.email === m.atty)?.name || m.atty;

  document.getElementById('main-content').innerHTML = `
    <div class="matter-header">
      <div class="matter-header-top">
        <div>
          <div class="matter-type-label">${TYPE_LABELS[m.type]}</div>
          <div class="matter-case-name">${m.name}</div>
          <div class="matter-ref">${m.caseNo}${m.ghost ? ' · Ghost: ' + m.ghost : ''} · ${attyName}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;color:var(--ink-3);margin-bottom:4px;">Phase ${phase} of 2</div>
          <div style="font-size:13px;font-weight:500;color:${phase===2?'var(--green)':'var(--amber)'};">
            ${phase === 2 ? '✓ Date allocated' : '⏳ Awaiting date'}
          </div>
        </div>
      </div>
      <div class="matter-meta-row">
        <div class="meta-item"><div class="meta-label">Date applied</div><div class="meta-value">${m.dateApplied ? formatDate(m.dateApplied) : '—'}</div></div>
        <div class="meta-item"><div class="meta-label">Date allocated</div><div class="meta-value">${m.dateAllocated ? formatDate(m.dateAllocated) : 'Pending'}</div></div>
        <div class="meta-item"><div class="meta-label">Phase 1</div><div class="meta-value">${p1done}/${p1items.length}</div></div>
        <div class="meta-item"><div class="meta-label">Phase 2</div><div class="meta-value">${p2done}/${p2items.length}</div></div>
      </div>
    </div>

    ${needsFollowup ? `
    <div class="followup-alert">
      <div class="followup-icon">⚠</div>
      <div class="followup-text">
        <div class="followup-title">Follow-up required — ${daysSince} days since date application</div>
        More than 14 court days have passed since the date was applied for on ${formatDate(m.dateApplied)}.
        Please follow up via email and in person with the Registrar's office.
      </div>
    </div>` : ''}

    ${!m.dateApplied ? `
    <div class="date-input-row">
      <span class="date-input-label">📅 Record date application submitted:</span>
      <input type="date" class="date-input" onchange="setDateApplied('${m.id}',this.value)" value="" />
    </div>` : ''}

    ${m.dateApplied && !m.dateAllocated ? `
    <div class="date-input-row">
      <span class="date-input-label">🎯 Date allocated? Enter to move to Phase 2:</span>
      <input type="date" class="date-input" onchange="setDateAllocated('${m.id}',this.value)" value="" />
    </div>` : ''}

    ${m.dateAllocated ? `
    <div style="background:var(--green-light);border:1px solid #BBF7D0;border-radius:8px;padding:0.75rem 1.5rem;margin-bottom:1.25rem;font-size:13px;color:var(--green);font-weight:500;display:flex;align-items:center;gap:1rem;">
      ✓ Court date: ${formatDate(m.dateAllocated)} — Phase 2 active
      <input type="date" class="date-input" style="margin-left:auto;" onchange="setDateAllocated('${m.id}',this.value)" value="${m.dateAllocated||''}" title="Change date" />
    </div>` : ''}

    <div class="phase-tabs">
      <button class="phase-tab ${currentPhase===1?'active':''}" onclick="switchPhase(1,'${m.id}')">Phase 1 — ${cl.phase1.title}</button>
      <button class="phase-tab ${currentPhase===2?'active':''}" onclick="switchPhase(2,'${m.id}')" ${!m.dateAllocated?'disabled':''}>Phase 2 — ${cl.phase2.title}</button>
    </div>

    <div class="checklist-card">
      <div class="checklist-card-header">
        <div class="checklist-card-title">${currentPhase===1?cl.phase1.title:cl.phase2.title}</div>
        <span class="progress-pill">${currentPhase===1?p1done+'/'+p1items.length:p2done+'/'+p2items.length} complete</span>
      </div>
      ${checklistHtml}
    </div>

    ${deadlinesHtml}
  `;
}

function switchPhase(phase, matterId) {
  currentPhase = phase;
  const m = matters[matterId];
  if (m) renderMatter(m);
}

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#991B1B' : '#1C1917';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Expose functions to global scope
window.openNewMatter  = openNewMatter;
window.closeModal     = closeModal;
window.createMatter   = createMatter;
window.openMatter     = openMatter;
window.showDashboard  = showDashboard;
window.toggleCheck    = toggleCheck;
window.setDateApplied = setDateApplied;
window.setDateAllocated = setDateAllocated;
window.switchPhase    = switchPhase;
window.addToCalendar  = addToCalendar;
window.addAllToCalendar = addAllToCalendar;

// Start
startListening();
</script>
